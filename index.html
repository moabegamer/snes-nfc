<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no">

    <title>SNES Mini Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .console {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: #dedede;
            padding: 15px;
        }

        .titulo {
            text-align: center;
            color: #444;
            margin: 5px 0 15px;
        }

        .titulo h1 {
            font-size: 20px;
            margin: 0;
        }

        .titulo p {
            font-size: 12px;
            margin-top: 5px;
        }

        .moldura {
            background: #555;
            padding: 10px;
            border-radius: 12px;
        }

        #game {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: black;
        }

        .info {
            text-align: center;
            color: #555;
            margin-top: 15px;
            font-size: 13px;
        }
        .controle-snes {
    background: #e8e5e8;
    padding: 12px 15px 20px;
    border-radius: 0 0 18px 18px;
}

.ombros {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}

.ombro {
    width: 105px;
    height: 30px;
    border: none;
    border-radius: 0 0 12px 12px;
    background: #555;
    color: #111;
    font-weight: bold;
    font-size: 16px;
}

.controles-principais {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 15px 30px;
}

.dpad {
    width: 125px;
    height: 125px;
    position: relative;
}

.dpad button,
.dpad .centro {
    position: absolute;
    width: 42px;
    height: 42px;
    border: none;
    background: #555;
    color: #222;
    font-size: 20px;
}

.dpad .up {
    top: 0;
    left: 42px;
    border-radius: 7px 7px 0 0;
}

.dpad .down {
    bottom: 0;
    left: 42px;
    border-radius: 0 0 7px 7px;
}

.dpad .left {
    top: 42px;
    left: 0;
    border-radius: 7px 0 0 7px;
}

.dpad .right {
    top: 42px;
    right: 0;
    border-radius: 0 7px 7px 0;
}

.dpad .centro {
    top: 42px;
    left: 42px;
}

.botoes-abxy {
    width: 135px;
    height: 135px;
    position: relative;
    background: #aaa;
    border-radius: 50%;
}

.acao {
    position: absolute;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid #555;
    font-weight: bold;
    font-size: 17px;
    color: #222;
}

.acao.x {
    top: 5px;
    left: 45px;
    background: #4285f4;
}

.acao.y {
    top: 45px;
    left: 5px;
    background: #4caf50;
}

.acao.a {
    top: 45px;
    right: 5px;
    background: #f44336;
}

.acao.b {
    bottom: 5px;
    left: 45px;
    background: #fbc02d;
}

.centrais {
    display: flex;
    justify-content: center;
    gap: 35px;
}

.centrais button {
    background: #ddd;
    border: 1px solid #888;
    border-radius: 15px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: bold;
    color: #555;
}
        </style>
        </head>
           
<body>

<div class="console">
    <div class="titulo">
    <h1>SUPER MINI GAME</h1>
        <p>Super Nintendo</p>
    </div>

    <div class="moldura">
        <div id="game"></div>
    </div>
<div class="controle-snes">

    <div class="ombros">
        <button id="btn-l" class="ombro">L</button>
        <button id="btn-r" class="ombro">R</button>
    </div>

    <div class="controles-principais">

        <div class="dpad">
            <button id="btn-up" class="up">▲</button>
            <button id="btn-left" class="left">◀</button>
            <button id="btn-right" class="right">▶</button>
            <button id="btn-down" class="down">▼</button>
            <div class="centro"></div>
        </div>

        <div class="botoes-abxy">
            <button id="btn-x" class="acao x">X</button>
            <button id="btn-y" class="acao y">Y</button>
            <button id="btn-a" class="acao a">A</button>
            <button id="btn-b" class="acao b">B</button>
        </div>

    </div>

    <div class="centrais">
        <button id="btn-select">SELECT</button>
        <button id="btn-start">START</button>
    </div>

</div>
    <div class="info">
        Toque no jogo para começar
    </div>

</div>

<script>

    EJS_player = "#game";

    EJS_core = "snes";

    EJS_gameName = "SNES Mini Game";

    EJS_gameUrl = "jogos/jogo.sfc";

    EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    EJS_startOnLoaded = true;
    EJS_language = "pt-BR";
EJS_controlScheme = "snes";
    EJS_VirtualGamepadSettings = [];

   </script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
