<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no">

    <title>SNES Mini Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .console {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: #dedede;
            padding: 15px;
        }

        .titulo {
            text-align: center;
            color: #444;
            margin: 5px 0 15px;
        }

        .titulo h1 {
            font-size: 20px;
            margin: 0;
        }

        .titulo p {
            font-size: 12px;
            margin-top: 5px;
        }

        .moldura {
            background: #555;
            padding: 10px;
            border-radius: 12px;
        }

        #game {
            width: 100%;
            height: 560px;
            background: black;
        }

        .info {
            text-align: center;
            color: #555;
            margin-top: 15px;
            font-size: 13px;
        }
           
    display: block;
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin: 0 auto 8px auto;
}
    </style>
</head>

<body>

<div class="console">
    <div class="titulo">
    <h1>SUPER MINI GAME</h1>
        <p>Super Nintendo</p>
    </div>

    <div class="moldura">
        <div id="game"></div>
    </div>

    <div class="info">
        Toque no jogo para começar
    </div>

</div>

<script>

    EJS_player = "#game";

    EJS_core = "snes";

    EJS_gameName = "SNES Mini Game";

    EJS_gameUrl = "jogos/jogo.sfc";

    EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    EJS_startOnLoaded = true;
    EJS_language = "pt-BR";
EJS_controlScheme = "snes";
    EJS_VirtualGamepadSettings = [
    {
        type: "dpad",
        location: "left",
        left: "50%",
        joystickInput: false,
        inputValues: [4, 5, 6, 7]
    },
    {
        type: "button",
        text: "Y",
        id: "y",
        location: "right",
        left: 40,
        bold: true,
        input_value: 9
    },
    {
        type: "button",
        text: "X",
        id: "x",
        location: "right",
        top: 40,
        bold: true,
        input_value: 1
    },
    {
        type: "button",
        text: "B",
        id: "b",
        location: "right",
        left: 81,
        top: 40,
        bold: true,
        input_value: 8
    },
    {
        type: "button",
        text: "A",
        id: "a",
        location: "right",
        left: 40,
        top: 80,
        bold: true,
        input_value: 0
    },
    {
        type: "button",
        text: "Select",
        id: "select",
        location: "center",
        left: -5,
        fontSize: 15,
        block: true,
        input_value: 2
    },
    {
        type: "button",
        text: "Start",
        id: "start",
        location: "center",
        left: 60,
        fontSize: 15,
        block: true,
        input_value: 3
    }
];
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
